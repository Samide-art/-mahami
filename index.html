<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مهامي</title>
  <meta name="description" content="سجّل ما أنجزته آخر اليوم، واحصل على تقييم من عشرة، وتابع نموّك يوميًا وأسبوعيًا وشهريًا.">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M6 24h20v-3h-3v-3h-3v-3h-3v-3h-4v3h-3v3H9v3H6z' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=clockfix2">
  <script>
    try { var th = localStorage.getItem('mahami-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true"><span class="mark"></span></div>

  <!-- تسجيل الدخول -->
  <main id="auth" class="auth" hidden>
    <section class="auth-card">
      <div class="brand brand-lg">
        <svg class="step-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26h24v-4h-4v-4h-4v-4h-4v-4h-8v4h-4v4H8v4H4z"/></svg>
        <h1>مهامي</h1>
      </div>
      <p class="auth-lead">سجّل ما أنجزته آخر اليوم. يعطيك الموقع تقييمًا من عشرة، ويحسب نموّك بدقة.</p>
      <form id="auth-form" novalidate>
        <label class="field">
          <span>البريد الإلكتروني</span>
          <input id="auth-email" type="email" inputmode="email" autocomplete="email" dir="ltr" required>
        </label>
        <label class="field">
          <span>كلمة المرور</span>
          <input id="auth-pass" type="password" autocomplete="current-password" dir="ltr" minlength="6" required>
        </label>
        <p id="auth-msg" class="msg" role="status" aria-live="polite"></p>
        <button class="btn btn-primary btn-block" id="auth-submit" type="submit">دخول</button>
      </form>
      <button class="link" id="auth-toggle" type="button">ليس لديك حساب؟ أنشئ حسابًا</button>
    </section>
  </main>

  <!-- التطبيق -->
  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand">
        <svg class="step-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26h24v-4h-4v-4h-4v-4h-4v-4h-8v4h-4v4H8v4H4z"/></svg>
        <span>مهامي</span>
      </div>
      <nav class="nav" aria-label="التنقل">
        <button data-view="today" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span>اليوم</span></button>
        <button data-view="week" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>الأسبوع</span></button>
        <button data-view="month" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>الشهر</span></button>
        <button data-view="log" class="nav-item"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>السجل</span></button>
        <button data-view="analytics" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17M8 15l3-4 3 2 5-7"/></svg><span>الإحصائيات</span></button>
        <button data-view="reviews" class="nav-item"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>المراجعة</span></button>
        <button data-view="settings" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>الإعدادات</span></button>
      </nav>
      <div class="side-foot">
        <div class="streak" id="side-streak"></div>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js?v=recurring1"></script>

<script>
(function(){
 function mountMahamiClock(){
  const head=document.querySelector('#view .page-head');
  if(!head)return;
  let meta=head.querySelector('.head-meta');
  if(!meta){
   const date=head.querySelector('.muted');
   if(!date)return;
   meta=document.createElement('div');
   meta.className='head-meta';
   date.parentNode.insertBefore(meta,date);
   meta.appendChild(date);
  }
  if(!meta.querySelector('.live-clock')){
   const clock=document.createElement('span');
   clock.className='live-clock';
   clock.setAttribute('aria-label','الوقت الحالي');
   clock.innerHTML='<span class="clock-live-dot"></span><span class="clock-digits"><span data-clock-hours>00</span><span class="clock-separator">:</span><span data-clock-minutes>00</span><span class="clock-separator">:</span><span class="clock-seconds" data-clock-seconds>00</span></span><span class="clock-label">الآن</span>';
   meta.appendChild(clock);
  }
  const now=new Date();
  const parts=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).split(':');
  const h=meta.querySelector('[data-clock-hours]'),m=meta.querySelector('[data-clock-minutes]'),s=meta.querySelector('[data-clock-seconds]');
  if(h&&m&&s){
   h.textContent=parts[0];m.textContent=parts[1];
   if(s.textContent!==parts[2]){s.textContent=parts[2];s.classList.remove('clock-tick');void s.offsetWidth;s.classList.add('clock-tick');}
  }
 }
 const start=function(){
  mountMahamiClock();
  new MutationObserver(mountMahamiClock).observe(document.getElementById('view')||document.body,{childList:true,subtree:true});
  setInterval(mountMahamiClock,1000);
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
</body>
</html>
